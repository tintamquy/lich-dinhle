<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lịch 2026 Phật Pháp - Mỗi tháng một câu Phật học ý nghĩa từ Kinh Địa Tạng">
    <meta property="og:image" content="og-image.png">
    <meta property="og:title" content="Lịch 2026 Phật Pháp">
    <meta property="og:description" content="Lịch 2026 với những câu Phật học ý nghĩa từ Kinh Địa Tạng">
    <meta name="theme-color" content="#007FFF">
    <title>Lịch 2026 Phật Pháp</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Language Selector -->
    <div class="language-selector-container">
        <button id="lang-toggle" class="lang-toggle-btn" title="Chọn ngôn ngữ">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
            <span id="current-lang-display">VI</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="chevron">
                <path d="M6 9l6 6 6-6"/>
            </svg>
        </button>
        <div id="lang-dropdown" class="lang-dropdown">
            <button class="lang-option" data-lang="vi" data-code="vi">
                <span class="lang-flag">🇻🇳</span>
                <span class="lang-name">Tiếng Việt</span>
            </button>
            <button class="lang-option" data-lang="en" data-code="en">
                <span class="lang-flag">🇺🇸</span>
                <span class="lang-name">English</span>
            </button>
            <button class="lang-option" data-lang="zh" data-code="zh-CN">
                <span class="lang-flag">🇨🇳</span>
                <span class="lang-name">中文</span>
            </button>
            <button class="lang-option" data-lang="ja" data-code="ja">
                <span class="lang-flag">🇯🇵</span>
                <span class="lang-name">日本語</span>
            </button>
            <button class="lang-option" data-lang="ko" data-code="ko">
                <span class="lang-flag">🇰🇷</span>
                <span class="lang-name">한국어</span>
            </button>
            <button class="lang-option" data-lang="fr" data-code="fr">
                <span class="lang-flag">🇫🇷</span>
                <span class="lang-name">Français</span>
            </button>
            <button class="lang-option" data-lang="de" data-code="de">
                <span class="lang-flag">🇩🇪</span>
                <span class="lang-name">Deutsch</span>
            </button>
            <button class="lang-option" data-lang="es" data-code="es">
                <span class="lang-flag">🇪🇸</span>
                <span class="lang-name">Español</span>
            </button>
            <button class="lang-option" data-lang="pt" data-code="pt">
                <span class="lang-flag">🇵🇹</span>
                <span class="lang-name">Português</span>
            </button>
            <button class="lang-option" data-lang="ru" data-code="ru">
                <span class="lang-flag">🇷🇺</span>
                <span class="lang-name">Русский</span>
            </button>
            <button class="lang-option" data-lang="ar" data-code="ar">
                <span class="lang-flag">🇸🇦</span>
                <span class="lang-name">العربية</span>
            </button>
            <button class="lang-option" data-lang="th" data-code="th">
                <span class="lang-flag">🇹🇭</span>
                <span class="lang-name">ไทย</span>
            </button>
        </div>
    </div>

    <!-- Google Translate (Hidden, used for actual translation) -->
    <div id="google_translate_element" style="display: none;"></div>

    <!-- Settings Toggle -->
    <div class="settings-toggle">
        <button id="toggle-events" class="toggle-btn" title="Bật/Tắt hiển thị ngày đặc biệt">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
            </svg>
            <span class="toggle-label">Sự kiện</span>
        </button>
    </div>

    <div id="app">
        <!-- Hero Section with Calendar -->
        <section class="hero-section">
            <div class="hero-background" id="hero-background"></div>
            <div class="hero-content">
                <div class="logo-header">
                    <img src="LOGO-1-1.png" alt="Logo" class="logo">
                    <div class="header-text">
                        <h1 class="main-title">Lịch 2026</h1>
                        <p class="main-subtitle">Phật Pháp</p>
                    </div>
                </div>

                <!-- Month Navigation -->
                <nav class="month-navigation">
                    <button id="prev-month" class="nav-btn" aria-label="Tháng trước">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 18l-6-6 6-6"/>
                        </svg>
                    </button>
                    <div class="month-indicator">
                        <span id="current-month-name" class="month-name"></span>
                        <span id="current-year" class="year"></span>
                    </div>
                    <button id="next-month" class="nav-btn" aria-label="Tháng sau">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 18l6-6-6-6"/>
                        </svg>
                    </button>
                </nav>

                <!-- Calendar Grid - Large and Prominent -->
                <div class="calendar-main">
                    <div class="calendar-wrapper">
                        <div class="calendar-header">
                            <div class="weekday">CN</div>
                            <div class="weekday">T2</div>
                            <div class="weekday">T3</div>
                            <div class="weekday">T4</div>
                            <div class="weekday">T5</div>
                            <div class="weekday">T6</div>
                            <div class="weekday">T7</div>
                        </div>
                        <div id="calendar-grid" class="calendar-grid"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Theme Section -->
        <section class="theme-section">
            <div class="theme-container">
                <div class="theme-animation-container" id="theme-animation-container">
                    <div class="theme-animation" id="theme-animation"></div>
                </div>
                <div class="quote-container">
                    <div class="quote-icon">☸</div>
                    <blockquote class="buddhist-quote">
                        <p id="quote-text"></p>
                        <cite class="quote-source" id="quote-source"></cite>
                    </blockquote>
                </div>
            </div>
        </section>

        <!-- Quick Month Selector -->
        <section class="month-selector-section">
            <div class="month-selector-container">
                <h2 class="section-title">Chọn Tháng</h2>
                <div class="month-selector">
                    <button class="month-btn" data-month="0">T12/2025</button>
                    <button class="month-btn" data-month="1">T1</button>
                    <button class="month-btn" data-month="2">T2</button>
                    <button class="month-btn" data-month="3">T3</button>
                    <button class="month-btn" data-month="4">T4</button>
                    <button class="month-btn" data-month="5">T5</button>
                    <button class="month-btn" data-month="6">T6</button>
                    <button class="month-btn" data-month="7">T7</button>
                    <button class="month-btn" data-month="8">T8</button>
                    <button class="month-btn" data-month="9">T9</button>
                    <button class="month-btn" data-month="10">T10</button>
                    <button class="month-btn" data-month="11">T11</button>
                    <button class="month-btn" data-month="12">T12/2026</button>
                </div>
            </div>
        </section>

        <!-- Factory Gallery Section -->
        <section class="gallery-section">
            <div class="gallery-container">
                <h2 class="section-title">Hình Ảnh Nhà Máy</h2>
                <p class="gallery-subtitle">Giới thiệu các nhà máy và cơ sở sản xuất</p>
                <div id="factory-gallery" class="factory-gallery"></div>
            </div>
        </section>
    </div>

    <!-- Gallery Lightbox Modal -->
    <div id="gallery-modal" class="gallery-modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">×</button>
            <button class="modal-nav modal-prev" id="modal-prev">‹</button>
            <button class="modal-nav modal-next" id="modal-next">›</button>
            <img id="modal-image" src="" alt="Factory Image">
            <div class="modal-info">
                <p id="modal-title"></p>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="lunar-calendar.js"></script>
    <script src="api-service.js"></script>
    <script src="gallery-data.js"></script>
    <script src="app.js"></script>
    <script type="text/javascript">
        // Google Translate - Enhanced
        let currentLangCode = 'vi';
        
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'vi',
                includedLanguages: 'vi,en,zh-CN,ja,ko,fr,de,es,pt,ru,ar,th',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false,
                multilanguagePage: true
            }, 'google_translate_element');
        }
        
        // Custom language selector
        document.addEventListener('DOMContentLoaded', () => {
            const langToggle = document.getElementById('lang-toggle');
            const langDropdown = document.getElementById('lang-dropdown');
            const langOptions = document.querySelectorAll('.lang-option');
            const currentLangDisplay = document.getElementById('current-lang-display');
            
            // Load saved language
            const savedLang = localStorage.getItem('selectedLanguage') || 'vi';
            currentLangCode = savedLang;
            updateLanguageDisplay(savedLang);
            
            // Toggle dropdown
            if (langToggle) {
                langToggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    langDropdown.classList.toggle('show');
                });
            }
            
            // Close dropdown when clicking outside
            document.addEventListener('click', (e) => {
                if (!langToggle.contains(e.target) && !langDropdown.contains(e.target)) {
                    langDropdown.classList.remove('show');
                }
            });
            
            // Language selection
            langOptions.forEach(option => {
                option.addEventListener('click', () => {
                    const lang = option.dataset.lang;
                    const code = option.dataset.code;
                    currentLangCode = code;
                    
                    // Save to localStorage
                    localStorage.setItem('selectedLanguage', code);
                    
                    // Update display
                    updateLanguageDisplay(lang);
                    
                    // Trigger Google Translate
                    if (window.google && window.google.translate) {
                        const select = document.querySelector('.goog-te-combo');
                        if (select) {
                            select.value = code;
                            select.dispatchEvent(new Event('change'));
                        }
                    }
                    
                    // Close dropdown
                    langDropdown.classList.remove('show');
                });
            });
            
            function updateLanguageDisplay(lang) {
                const langMap = {
                    'vi': 'VI',
                    'en': 'EN',
                    'zh': '中文',
                    'ja': 'JP',
                    'ko': 'KR',
                    'fr': 'FR',
                    'de': 'DE',
                    'es': 'ES',
                    'pt': 'PT',
                    'ru': 'RU',
                    'ar': 'AR',
                    'th': 'TH'
                };
                
                if (currentLangDisplay) {
                    currentLangDisplay.textContent = langMap[lang] || lang.toUpperCase();
                }
                
                // Update active state
                langOptions.forEach(opt => {
                    opt.classList.toggle('active', opt.dataset.lang === lang);
                });
            }
        });
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('Service Worker registered:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
