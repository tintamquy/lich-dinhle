<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lịch 2026 Phật Pháp - Mỗi tháng một câu Phật học ý nghĩa từ Kinh Địa Tạng">
    <meta property="og:image" content="og-image.png">
    <meta property="og:title" content="Lịch 2026 Phật Pháp">
    <meta property="og:description" content="Lịch 2026 với những câu Phật học ý nghĩa từ Kinh Địa Tạng">
    <meta name="theme-color" content="#007FFF">
    <title>Lịch 2026 Phật Pháp</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Google Translate -->
    <div id="google_translate_element" class="google-translate"></div>

    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="logo-container">
                <img src="LOGO-1-1.png" alt="Logo" class="logo">
            </div>
            <div class="header-title">
                <h1>Lịch 2026</h1>
                <p class="subtitle">Phật Pháp</p>
            </div>
        </header>

        <!-- Month Navigation -->
        <nav class="month-navigation">
            <button id="prev-month" class="nav-btn" aria-label="Tháng trước">‹</button>
            <div class="month-indicator">
                <span id="current-month-name" class="month-name"></span>
                <span id="current-year" class="year">2026</span>
            </div>
            <button id="next-month" class="nav-btn" aria-label="Tháng sau">›</button>
        </nav>

        <!-- Calendar Grid -->
        <main class="calendar-container">
            <div class="calendar-wrapper">
                <div class="calendar-header">
                    <div class="weekday">CN</div>
                    <div class="weekday">T2</div>
                    <div class="weekday">T3</div>
                    <div class="weekday">T4</div>
                    <div class="weekday">T5</div>
                    <div class="weekday">T6</div>
                    <div class="weekday">T7</div>
                </div>
                <div id="calendar-grid" class="calendar-grid"></div>
            </div>
        </main>

        <!-- Month Theme Display -->
        <div class="theme-display" id="theme-display">
            <div class="theme-animation" id="theme-animation"></div>
            <div class="buddhist-quote">
                <p id="quote-text"></p>
                <p class="quote-source" id="quote-source"></p>
            </div>
        </div>

        <!-- Quick Month Selector -->
        <div class="month-selector">
            <button class="month-btn" data-month="0">T12/2025</button>
            <button class="month-btn" data-month="1">T1</button>
            <button class="month-btn" data-month="2">T2</button>
            <button class="month-btn" data-month="3">T3</button>
            <button class="month-btn" data-month="4">T4</button>
            <button class="month-btn" data-month="5">T5</button>
            <button class="month-btn" data-month="6">T6</button>
            <button class="month-btn" data-month="7">T7</button>
            <button class="month-btn" data-month="8">T8</button>
            <button class="month-btn" data-month="9">T9</button>
            <button class="month-btn" data-month="10">T10</button>
            <button class="month-btn" data-month="11">T11</button>
            <button class="month-btn" data-month="12">T12/2026</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script type="text/javascript">
        // Google Translate
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'vi',
                includedLanguages: 'vi,en,zh-CN,ja,ko,fr,de,es,pt,ru,ar,th',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
